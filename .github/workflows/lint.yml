name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run awesome-lint
        run: npx --yes awesome-lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-entries:
    name: README entries parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse entries without network access
        run: python scripts/check_activity.py --list
